version: '3'

tasks:
  run:pg:
    desc: Run the API on Postgres (:8084)
    env:
      DB_DRIVER: postgres
    cmds:
      - go run ./cmd/api

  run:mongo:
    desc: Run the API on MongoDB (:8084)
    env:
      DB_DRIVER: mongo
    cmds:
      - go run ./cmd/api

  test:
    desc: Unit tests (no Docker)
    cmds:
      - go test ./...

  test:integration:
    desc: Contract and rollback tests against Postgres and MongoDB containers (needs Docker)
    cmds:
      - go test -tags=integration ./...

  lint:
    desc: gofmt and go vet, with and without the integration tag
    cmds:
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - go vet ./...
      - go vet -tags=integration ./...
