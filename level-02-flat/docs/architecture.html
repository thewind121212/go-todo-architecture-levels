<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level 2 · Architecture</title>
  <!-- Font source: system. No web-font link: GitHub blocks web fonts inside README images. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Level 2</p>
    <h1>Flat package: files, not boundaries</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">Level 2: flat-package Todo API</title>
        <desc id="architecture-desc">Level 1 split into six files of one package main: main.go picks a store by DB_DRIVER, handler.go calls the store interface in store.go, and store_postgres.go and store_mongo.go still open their own transaction to write a todo and its activity rows, calling applyPatch from todo.go.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Container: the one package -->
        <rect x="40" y="40" width="664" height="312" rx="8" fill="rgba(45,49,66,0.02)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="60" y="55" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">package main · six files</text>

        <!-- Arrows (drawn before nodes) -->
        <!-- main -> handler -->
        <line x1="144" y1="136" x2="144" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- main -> store (openStore picks one by DB_DRIVER) -->
        <path d="M 224,104 H 336 Q 344,104 344,112 V 168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- handler -> store -->
        <line x1="224" y1="200" x2="272" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- store -> postgresStore / mongoStore (fanned ports on store's right edge) -->
        <path d="M 416,188 H 440 Q 448,188 448,180 V 112 Q 448,104 456,104 H 480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 416,212 H 440 Q 448,212 448,220 V 288 Q 448,296 456,296 H 480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- both stores call the shared rule -->
        <line x1="580" y1="136" x2="580" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="580" y1="264" x2="580" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- stores -> databases -->
        <line x1="680" y1="104" x2="780" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="680" y1="296" x2="780" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="248" y="84" width="64" height="12" rx="2" fill="#f1f1f1"/>
        <text x="280" y="93" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DB_DRIVER</text>
        <rect x="716" y="84" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="742" y="93" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ONE TX</text>
        <rect x="716" y="276" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="742" y="285" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ONE TX</text>

        <!-- Node: main.go -->
        <rect x="64" y="72" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="72" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="72" y="78" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="92" y="87" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">WIRING</text>
        <text x="144" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">main.go</text>
        <text x="144" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">openStore · newRouter</text>

        <!-- Node: handler.go -->
        <rect x="64" y="168" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="168" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="72" y="174" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="88" y="183" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>
        <text x="144" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">handler.go</text>
        <text x="144" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">handler · writeError</text>

        <!-- Node: store.go -->
        <rect x="272" y="168" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="272" y="168" width="144" height="64" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="280" y="174" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="298" y="183" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">IFACE</text>
        <text x="344" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">store.go</text>
        <text x="344" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">store interface</text>

        <!-- Node: store_postgres.go (focal: opens the transaction) -->
        <rect x="480" y="72" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="480" y="72" width="200" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="488" y="78" width="24" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="500" y="87" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TX</text>
        <text x="580" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">store_postgres.go</text>
        <text x="580" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">postgresStore · inTx</text>

        <!-- Node: todo.go -->
        <rect x="480" y="168" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="480" y="168" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="488" y="174" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="508" y="183" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DOMAIN</text>
        <text x="580" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">todo.go</text>
        <text x="580" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">applyPatch · validatePatch</text>

        <!-- Node: store_mongo.go (focal: opens the transaction) -->
        <rect x="480" y="264" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="480" y="264" width="200" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="488" y="270" width="24" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="500" y="279" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TX</text>
        <text x="580" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">store_mongo.go</text>
        <text x="580" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">mongoStore · inTx</text>

        <!-- Node: PostgreSQL -->
        <rect x="780" y="72" width="140" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="780" y="72" width="140" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="788" y="78" width="24" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="800" y="87" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="850" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PostgreSQL</text>
        <text x="850" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">todos · activities</text>

        <!-- Node: MongoDB -->
        <rect x="780" y="264" width="140" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="780" y="264" width="140" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="788" y="270" width="24" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="800" y="279" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="850" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">MongoDB</text>
        <text x="850" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">todos · activities</text>

        <!-- Annotation callout -->
        <text x="404" y="312" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">each store still opens its own transaction</text>
        <path d="M 412,308 Q 452,308 476,320" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="479" cy="320" r="2" fill="#2d3142"/>

        <text x="744" y="190" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">one package:</text>
        <text x="744" y="208" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">every file can call</text>
        <text x="744" y="226" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">every other file</text>
        <path d="M 738,186 Q 720,186 708,196" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="705" cy="198" r="2" fill="#2d3142"/>

        <!-- Legend strip -->
        <line x1="40" y1="380" x2="920" y2="380" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="398" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="412" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="420" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Opens the transaction</text>

        <rect x="208" y="412" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="228" y="420" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Go file</text>

        <rect x="292" y="412" width="14" height="10" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="312" y="420" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Interface</text>

        <rect x="400" y="412" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="420" y="420" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Database</text>

        <rect x="508" y="412" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="528" y="420" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Package</text>

        <line x1="628" y1="417" x2="656" y2="417" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="664" y="420" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Calls</text>
      </svg>
    </div>
  </div>
</body>
</html>
