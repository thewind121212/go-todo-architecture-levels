<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level 5: Clean Architecture</title>
  <!-- Font source: system. No web-font link: GitHub blocks web fonts inside README images,
       so every stack below falls through to the platform's own sans, serif and mono faces. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width); this wrapper
       lets a narrow screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Level 5</p>
    <h1>Level 5: Clean Architecture</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">Level 5: Clean Architecture</title>
        <desc id="architecture-desc">Clean Architecture rings for level 5: entity inside usecase inside adapter (http, postgres, mongo) inside infrastructure and cmd/api, with every import pointing inward; the use cases own the ports that the Postgres and Mongo adapters implement, the UpdateTodo interactor opens the transaction, and arch_test.go fails the build if the core imports outward.</desc>

          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Rings, outermost first: every ring keeps the same inset (24 sides, 116 top, 20 bottom) -->
        <rect x="40" y="40" width="696" height="480" rx="8" fill="rgba(45,49,66,0.015)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="52" y="44" width="160" height="12" rx="2" fill="#f5f5f5"/>
        <text x="58" y="53" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">INFRASTRUCTURE + CMD/API</text>
        <rect x="64" y="156" width="648" height="344" rx="8" fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.45)" stroke-width="1"/>
        <rect x="76" y="160" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="82" y="169" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">ADAPTER</text>
        <!-- The core boundary (focal): nothing inside may import anything outside -->
        <rect x="88" y="272" width="600" height="208" rx="8" fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="6,4"/>
        <rect x="100" y="276" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="106" y="285" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" letter-spacing="0.14em">USECASE</text>
        <rect x="112" y="388" width="552" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="124" y="392" width="52" height="12" rx="2" fill="#ffffff"/>
        <text x="130" y="401" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">ENTITY</text>

        <path d="M 364,120 V 136 Q 364,144 356,144 H 184 Q 176,144 176,152 V 188" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 388,120 V 188" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 412,120 V 136 Q 412,144 420,144 H 592 Q 600,144 600,152 V 188" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 200,236 V 304" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <path d="M 600,236 V 304" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <path d="M 264,332 H 300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 188,360 V 388" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 776,420 H 688" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="1.5,3" stroke-linecap="round" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="396" y="164" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="416" y="173" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WIRES</text>
        <rect x="208" y="246" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="234" y="255" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EXECUTE</text>
        <rect x="396" y="246" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="430" y="255" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">IMPLEMENTS</text>
        <rect x="608" y="246" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="642" y="255" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">IMPLEMENTS</text>
        <rect x="196" y="366" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="214" y="375" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">USES</text>

        <rect x="88" y="72" width="176" height="48" rx="6" fill="#f5f5f5"/>

        <text x="176" y="93" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">config</text>
        <text x="176" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">infrastructure/config</text>
        <!-- Node: main -->
        <rect x="300" y="72" width="176" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="72" width="176" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="388" y="93" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">main.go</text>
        <text x="388" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cmd/api · composition root</text>
        <!-- Node: server -->
        <rect x="512" y="72" width="176" height="48" rx="6" fill="#f5f5f5"/>

        <text x="600" y="93" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">server</text>

        <rect x="88" y="188" width="176" height="48" rx="6" fill="#f5f5f5"/>

        <text x="176" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">controllers · presenters</text>
        <!-- Node: postgres adapter -->
        <rect x="300" y="188" width="176" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="188" width="176" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="388" y="209" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">postgres</text>
        <text x="388" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">GORM repos · TxManager</text>
        <!-- Node: mongo adapter -->
        <rect x="512" y="188" width="176" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="512" y="188" width="176" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="600" y="209" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">mongo</text>
        <text x="600" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">driver repos · TxManager</text>
        <!-- Node: interactor -->
        <rect x="112" y="304" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="112" y="304" width="152" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="188" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">UpdateTodo</text>
        <text x="188" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1 of 6 interactors</text>
        <text x="188" y="350" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">opens WithinTx</text>
        <!-- Node: usecase/ports.go, the interfaces the core owns -->
        <rect x="300" y="304" width="364" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="304" width="364" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="482" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">ports.go</text>
        <rect x="332" y="332" width="96" height="18" rx="3" fill="#ffffff" stroke="rgba(90,101,128,0.45)" stroke-width="0.8"/>

        <rect x="564" y="332" width="68" height="18" rx="3" fill="#ffffff" stroke="rgba(90,101,128,0.45)" stroke-width="0.8"/>
        <text x="598" y="344.5" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">TxManager</text>
        <!-- Entity content (innermost ring) -->
        <text x="388" y="422" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Todo · Activity</text>
        <text x="388" y="440" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Rename · SetCompleted · sentinel errors · stdlib + uuid only</text>
        <!-- Node: arch_test.go (focal) -->
        <rect x="776" y="380" width="144" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="776" y="380" width="144" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="848" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">arch_test.go</text>
        <text x="848" y="419" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">fails the build if</text>
        <text x="848" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">entity or usecase</text>
        <text x="848" y="445" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">imports outward</text>

        <!-- Margin callout -->
        <text x="776" y="200" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Every import</text>
        <text x="776" y="218" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">points inward.</text>

        <!-- Legend strip -->
        <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

        <rect x="40" y="569" width="14" height="10" rx="2" fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1" stroke-dasharray="6,4"/>
        <text x="60" y="577" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Core boundary</text>
