# Shared databases for every level. Start once: `docker compose up -d`
#
# Postgres: one database per level (todo_l01 … todo_l09), created by deploy/postgres-init.sql
# Mongo:    single-node replica set "rs0" — MongoDB only supports transactions on a replica set
#           Connect from the host with: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    ports:
      - "5432:5432"
    volumes:
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 3s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    # The healthcheck doubles as the replica-set initializer: first run calls rs.initiate.
    healthcheck:
      test: >
        mongosh --port 27017 --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 3s
      timeout: 10s
      retries: 30

volumes:
  pgdata:
  mongodata:
