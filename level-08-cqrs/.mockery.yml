# mockery v3: generates testify mocks for the repository and the ports. Run with `task mock:generate`.
all: false
dir: '{{.InterfaceDir}}/mocks'
filename: '{{.InterfaceName}}.go'
structname: 'Mock{{.InterfaceName}}'
pkgname: mocks
template: testify
formatter: goimports
force-file-write: true
packages:
  example.com/todo/level08/internal/todo/domain:
    interfaces:
      TodoRepository:
  example.com/todo/level08/internal/todo/ports:
    interfaces:
      TodoCommands:
      TodoQueries:
  example.com/todo/level08/internal/todo/application/query:
    interfaces:
      TodoViews:
      ActivityViews:
  example.com/todo/level08/internal/todo/outbox:
    interfaces:
      Store:
      Handler:
