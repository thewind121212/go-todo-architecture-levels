<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 764" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">Level 3: layered Todo API</title>
        <desc id="architecture-desc">Three layers: the Handler calls TodoService, which opens the transaction through TxManager.WithinTx and passes it in ctx to TodoRepository and ActivityRepository; the postgres and mongo adapters each implement all three interfaces and pick the transaction up from ctx when they write to PostgreSQL or MongoDB.</desc>
        <defs>
      <style>#architecture-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="architecture-arrow-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="1 1, 9 4, 1 7" fill="#f1f1f1" stroke="#4f5d75" stroke-width="1"/></marker>
          <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Layer bands (zones), drawn first -->
        <rect x="40" y="40" width="880" height="96" rx="8" fill="#2d3142" stroke="#bfc0c0" stroke-width="1" fill-opacity="0.02"/>
        <text x="56" y="62" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">handler/</text>
        <text x="56" y="78" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">HTTP only</text>

        <rect x="40" y="168" width="880" height="96" rx="8" fill="#2d3142" stroke="#bfc0c0" stroke-width="1" fill-opacity="0.02"/>
        <text x="56" y="190" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">service/</text>
        <text x="56" y="206" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">business flow</text>

        <rect x="40" y="296" width="880" height="268" rx="8" fill="#2d3142" stroke="#bfc0c0" stroke-width="1" fill-opacity="0.02"/>
        <text x="56" y="318" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">repository/</text>
        <text x="56" y="334" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">plain CRUD</text>

        <!-- Group: the contracts in repository.go -->
        <rect x="172" y="332" width="696" height="112" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.20"/>
        <text x="184" y="347" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">repository.go</text>

        <!-- Arrows (drawn before nodes) -->
        <!-- Handler -> TodoService -->
        <line x1="520" y1="120" x2="520" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <!-- TodoService -> TxManager: opens the transaction (focal path) -->
        <path d="M 470,248 V 272 Q 470,280 462,280 H 296 Q 288,280 288,288 V 364" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#architecture-arrow-accent)"/>
        <!-- TodoService -> TodoRepository / ActivityRepository, with the tx inside ctx -->
        <line x1="520" y1="248" x2="520" y2="364" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <path d="M 570,248 V 272 Q 570,280 578,280 H 744 Q 752,280 752,288 V 364" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <!-- adapters implement all three interfaces: realization up to the repository.go group, landing between interfaces -->
        <line x1="404" y1="484" x2="404" y2="444" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow-open)"/>
        <line x1="636" y1="484" x2="636" y2="444" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow-open)"/>
        <!-- adapters -> databases -->
        <line x1="340" y1="548" x2="340" y2="604" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <line x1="700" y1="548" x2="700" y2="604" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>

        <!-- Arrow labels (beside the vertical segments) -->
        <rect x="296" y="304" width="52" height="12" rx="2" fill="#f1f1f1"/>
        <text x="322" y="313" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">OPENS TX</text>
        <rect x="528" y="304" width="60" height="12" rx="2" fill="#f1f1f1"/>
        <text x="558" y="313" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TX IN CTX</text>
        <rect x="760" y="304" width="60" height="12" rx="2" fill="#f1f1f1"/>
        <text x="790" y="313" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TX IN CTX</text>

        <rect x="336" y="458" width="60" height="12" rx="2" fill="#f1f1f1"/>
        <text x="366" y="467" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">IMPLEMENTS</text>
        <rect x="644" y="458" width="60" height="12" rx="2" fill="#f1f1f1"/>
        <text x="674" y="467" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">IMPLEMENTS</text>

        <!-- Node: Handler -->
        <rect x="420" y="56" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="420" y="56" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="428" y="62" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="444" y="71" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>
