        <text x="700" y="640" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">MongoDB</text>
        <text x="700" y="656" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">todos · activities</text>

        <!-- Annotation callout -->
        <text x="668" y="210" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">the service decides what</text>
        <text x="668" y="228" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">goes in one transaction</text>
