        <text x="520" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Gin · DTOs · writeError</text>

        <!-- Node: TodoService (focal: opens the transaction) -->
        <rect x="420" y="184" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="420" y="184" width="200" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="428" y="190" width="24" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="440" y="199" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TX</text>
        <text x="520" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">TodoService</text>
        <text x="520" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one flow for both DBs</text>

        <!-- Node: TxManager -->
        <rect x="188" y="364" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="188" y="364" width="200" height="64" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="196" y="370" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="214" y="379" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">IFACE</text>
        <text x="288" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">TxManager</text>
        <text x="288" y="416" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">WithinTx(ctx, fn)</text>

        <!-- Node: TodoRepository -->
        <rect x="420" y="364" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="420" y="364" width="200" height="64" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="428" y="370" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="446" y="379" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">IFACE</text>
        <text x="520" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">TodoRepository</text>
        <text x="520" y="416" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">GetForUpdate · Update</text>

        <!-- Node: ActivityRepository -->
        <rect x="652" y="364" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="652" y="364" width="200" height="64" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="660" y="370" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="678" y="379" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">IFACE</text>
        <text x="752" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">ActivityRepository</text>
        <text x="752" y="416" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Create · ListByTodo</text>

        <!-- Node: postgres/ adapter -->
        <rect x="240" y="484" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="240" y="484" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="248" y="490" width="44" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="270" y="499" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ADAPTER</text>
        <text x="340" y="520" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">postgres/</text>
        <text x="340" y="536" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">GORM · conn(ctx) finds tx</text>

        <!-- Node: mongo/ adapter -->
        <rect x="600" y="484" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="600" y="484" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="608" y="490" width="44" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="630" y="499" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ADAPTER</text>
        <text x="700" y="520" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">mongo/</text>
        <text x="700" y="536" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">driver v2 · session in ctx</text>

        <!-- Node: PostgreSQL -->
        <rect x="270" y="604" width="140" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="270" y="604" width="140" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="278" y="610" width="24" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="290" y="619" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="340" y="640" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PostgreSQL</text>
        <text x="340" y="656" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">todos · activities</text>

        <!-- Node: MongoDB -->
        <rect x="630" y="604" width="140" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="630" y="604" width="140" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="638" y="610" width="24" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
