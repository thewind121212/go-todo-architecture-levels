<!DOCTYPE html>

<head>

  <title>Level 6: Hexagonal (Ports &amp; Adapters)</title>
  <!-- Font source: system. No web-font link: GitHub blocks web fonts inside README images,
       so every stack below falls through to the platform's own sans, serif and mono faces. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width); this wrapper
       lets a narrow screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Level 6</p>
    <h1>Level 6: Hexagonal (Ports &amp; Adapters)</h1>

        <title id="architecture-title">Level 6: Hexagonal (Ports &amp; Adapters)</title>
        <desc id="architecture-desc">Hexagonal architecture for level 6: the HTTP driving adapter calls the driving port ports.TodoService, which service.TodoService implements; the service calls the driven ports TodoRepository, ActivityRepository and TxManager, which the Postgres and Mongo adapters implement; Wire binds one adapter set per DB_DRIVER.</desc>

          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <text x="40" y="426" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">called by the app</text>

        <text x="480" y="189" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ports/service.go</text>
