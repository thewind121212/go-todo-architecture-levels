<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">Level 9 modular monolith: modules meet only on the event bus</title>
        <desc id="architecture-desc">Inside one process, the platform's outbox.Relay polls the todo module's todo.outbox and publishes each event as a todo/contracts integration event on eventbus.Bus; the todo projector and the activity module's Service.Record each commit it in their own module's storage, todo.todo_views and activity.activities, and the activity module imports nothing from todo except its contracts.</desc>
        <defs>
      <style>#architecture-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones: modules and platform -->
        <rect x="40" y="48" width="416" height="384" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.14"/>
        <rect x="48" y="52" width="144" height="12" rx="2" fill="#f5f5f5"/>
        <text x="120" y="61" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">TODO MODULE · OWNS TODO.*</text>
        <rect x="496" y="48" width="176" height="256" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.14"/>
        <rect x="504" y="52" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="530" y="61" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">PLATFORM</text>
        <rect x="712" y="48" width="208" height="256" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.14"/>
        <rect x="720" y="52" width="184" height="12" rx="2" fill="#f5f5f5"/>
        <text x="812" y="61" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">ACTIVITY MODULE · OWNS ACTIVITY.*</text>

        <!-- Arrows (behind nodes) -->
        <path d="M 216,120 H 248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <path d="M 440,120 H 512" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <path d="M 584,152 V 216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <path d="M 512,248 H 440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <path d="M 656,248 H 728" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <path d="M 248,248 H 216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <path d="M 816,216 V 152" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <path d="M 760,280 V 368 Q 760,376 752,376 H 440" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#architecture-arrow)"/>

        <!-- Arrow labels -->
        <rect x="460" y="100" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="476" y="109" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POLL</text>
        <rect x="592" y="178" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="616" y="187" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PUBLISH</text>
        <rect x="458" y="228" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="476" y="237" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EVENT</text>
        <rect x="674" y="228" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="692" y="237" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EVENT</text>
        <rect x="558" y="356" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="596" y="365" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">IMPORTS ONLY</text>

        <!-- Nodes -->
        <!-- Node: todo commands -->
        <rect x="56" y="88" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="88" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="64" y="96" width="24" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.4"/>
        <text x="76" y="105" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CMD</text>
        <text x="136" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">command.Service</text>
        <text x="136" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Todo aggregate · Save</text>
        <!-- Node: todo outbox -->
        <rect x="248" y="88" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="248" y="88" width="192" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="256" y="96" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.5"/>
        <text x="276" y="105" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">OUTBOX</text>
        <text x="344" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">todo.outbox</text>
        <text x="344" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tx 1, with todo.todos</text>
        <!-- Node: todo read model -->
        <rect x="56" y="216" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="216" width="160" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="64" y="224" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.5"/>
        <text x="78" y="233" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">VIEW</text>
        <text x="136" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">todo.todo_views</text>
        <text x="136" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tx 2 · upsert</text>
        <!-- Node: todo projector -->
        <rect x="248" y="216" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="248" y="216" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="256" y="224" width="24" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.4"/>
        <text x="268" y="233" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SUB</text>
        <text x="344" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">projection.Projector</text>
        <text x="344" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">subscriber · own tx 2</text>
        <!-- Node: contracts (focal) -->
        <rect x="248" y="344" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="248" y="344" width="192" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="256" y="352" width="40" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.5"/>
        <text x="276" y="361" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PUBLIC</text>
        <text x="344" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">todo/contracts</text>
        <text x="344" y="396" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">todo.created … todo.deleted</text>
        <!-- Node: relay -->
        <rect x="512" y="88" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="512" y="88" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="520" y="96" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.4"/>
        <text x="540" y="105" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">WORKER</text>
        <text x="584" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">outbox.Relay</text>
        <text x="584" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">deliver, then mark</text>
        <!-- Node: event bus (focal) -->
        <rect x="512" y="216" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="512" y="216" width="144" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="520" y="224" width="24" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.5"/>
        <text x="532" y="233" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BUS</text>
        <text x="584" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">eventbus.Bus</text>
        <text x="584" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">in process · sync</text>
        <!-- Node: activity log -->
        <rect x="728" y="88" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="728" y="88" width="176" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="736" y="96" width="24" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.5"/>
        <text x="748" y="105" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">LOG</text>
        <text x="816" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">activity.activities</text>
        <text x="816" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one insert per event</text>
        <!-- Node: activity subscriber -->
        <rect x="728" y="216" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="728" y="216" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="736" y="224" width="24" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.4"/>
        <text x="748" y="233" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SUB</text>
        <text x="816" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Service.Record</text>
        <text x="816" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">activity subscriber</text>

        <!-- Callout -->
        <text x="920" y="420" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">no transaction crosses a module boundary:</text>
        <text x="920" y="438" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">activities catch up one poll later</text>

        <!-- Legend -->
        <line x1="40" y1="464" x2="920" y2="464" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.1"/>
        <text x="40" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="104" y="480" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="124" y="488" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Focal: bus + contracts</text>
        <rect x="248" y="480" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="268" y="488" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Code</text>
        <rect x="316" y="480" width="14" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="336" y="488" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Postgres table or Mongo collection</text>
        <rect x="512" y="480" width="14" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.3"/>
        <text x="532" y="488" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Module</text>
        <line x1="588" y1="485" x2="612" y2="485" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <text x="620" y="488" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Call / write</text>
        <line x1="700" y1="485" x2="724" y2="485" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#architecture-arrow)"/>
        <text x="732" y="488" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Go import</text>

      </svg>
