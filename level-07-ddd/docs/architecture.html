<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level 7 architecture</title>
  <!-- Font source: system. No web-font link: GitHub blocks remote fonts inside README images,
       so every stack falls through to the viewer's own sans, mono and serif faces. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Level 7 · DDD</p>
    <h1>The aggregate is the transaction boundary</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">Level 7 DDD: Save writes state and events in one transaction</title>
        <desc id="architecture-desc">A PATCH goes from the HTTP handler to application.TodoService, which calls behavior on the Todo aggregate; domain.TodoRepository.Save then writes the aggregate's state to todos and its recorded events to activities in one transaction, through the Postgres or the Mongo adapter, and a stale version fails the whole save with 409.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="664" y="40" width="256" height="136" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/>
        <rect x="672" y="44" width="180" height="12" rx="2" fill="#f5f5f5"/>
        <text x="762" y="53" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">AGGREGATE = CONSISTENCY BOUNDARY</text>
        <rect x="96" y="332" width="768" height="208" rx="8" fill="rgba(191,69,32,0.05)" stroke="rgba(191,69,32,0.5)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="348" y="336" width="264" height="12" rx="2" fill="#f5f5f5"/>
        <text x="480" y="345" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">ONE TRANSACTION · STATE + EVENTS COMMIT TOGETHER</text>

        <!-- Arrows (behind nodes) -->
        <path d="M 200,112 H 360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 600,112 H 680" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 480,144 V 224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 600,256 H 784 Q 792,256 792,248 V 152" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <path d="M 320,428 H 344 Q 352,428 352,420 V 408 Q 352,400 360,400 H 380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 320,460 H 344 Q 352,460 352,468 V 480 Q 352,488 360,488 H 380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 640,428 H 616 Q 608,428 608,420 V 408 Q 608,400 600,400 H 580" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 640,460 H 616 Q 608,460 608,468 V 480 Q 608,488 600,488 H 580" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="236" y="92" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="280" y="101" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">UPDATE(RAW ID)</text>
        <rect x="606" y="92" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="632" y="101" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BEHAVIOR</text>
        <rect x="408" y="178" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="440" y="187" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SAVE(TODO)</text>
        <rect x="656" y="236" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="692" y="245" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PULLEVENTS()</text>

        <rect x="48" y="88" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.4)" stroke-width="0.8"/>
        <text x="62" y="97" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>
        <text x="120" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">HTTP handler</text>
        <text x="120" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PATCH /todos/:id</text>
        <!-- Node: application service -->
        <rect x="360" y="80" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="360" y="80" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="368" y="88" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
        <text x="380" y="97" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="480" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">application.TodoService</text>
        <text x="480" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">parse → load → behavior → Save</text>
        <!-- Node: Todo aggregate root, with the domain events it records -->
        <rect x="680" y="72" width="224" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="72" width="224" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="688" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
        <text x="702" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ROOT</text>
        <text x="792" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Todo aggregate</text>
        <text x="792" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Rename · Complete · Reopen · Delete</text>
        <text x="704" y="141" fill="#5a6580" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace">records</text>
        <rect x="744" y="132" width="60" height="12" rx="2" fill="#f5f5f5" stroke="rgba(79,93,117,0.5)" stroke-width="0.8"/>
        <text x="774" y="141" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">TodoRenamed</text>
        <rect x="812" y="132" width="68" height="12" rx="2" fill="#f5f5f5" stroke="rgba(79,93,117,0.5)" stroke-width="0.8"/>
        <text x="846" y="141" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">TodoCompleted</text>
        <!-- Node: Save (focal) -->
        <rect x="360" y="224" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="360" y="224" width="240" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="368" y="232" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.5)" stroke-width="0.8"/>
        <text x="382" y="241" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PORT</text>
        <text x="480" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">domain.TodoRepository.Save</text>
        <text x="480" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">state + events, version check</text>
        <!-- Node: Postgres adapter -->
        <rect x="128" y="412" width="192" height="64" rx="6" fill="#f5f5f5"/>

        <text x="224" y="448" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">postgres adapter</text>
        <text x="224" y="464" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">db.Transaction</text>
        <!-- Node: Mongo adapter -->
        <rect x="640" y="412" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="640" y="412" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

        <text x="666" y="429" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MONGO</text>

        <text x="736" y="464" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">session.WithTransaction</text>
        <!-- Node: todos -->
        <rect x="380" y="372" width="200" height="56" rx="6" fill="#f5f5f5"/>

        <text x="480" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">todos</text>
        <text x="480" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">WHERE version = v</text>
        <!-- Node: activities -->
        <rect x="380" y="460" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="460" width="200" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="388" y="468" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.5)" stroke-width="0.8"/>
        <text x="408" y="477" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EVENTS</text>
        <text x="480" y="492" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">activities</text>
        <text x="480" y="508" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one row per event</text>

        <!-- Callout -->
        <text x="344" y="250" fill="#bf4520" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">stale version? 0 rows updated:</text>
        <text x="344" y="268" fill="#bf4520" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">ErrConflict → 409, nothing persists</text>
        <path d="M 348,256 H 358" fill="none" stroke="rgba(191,69,32,0.5)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="360" cy="256" r="2" fill="#bf4520"/>

        <!-- Legend -->
        <line x1="40" y1="560" x2="920" y2="560" stroke="rgba(45,49,66,0.1)" stroke-width="0.8"/>
